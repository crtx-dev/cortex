<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cortex management</title><link rel="stylesheet" href="/app/assets/css/manage.css"><script defer src="/app/assets/js/manage.js"></script></head><body><main><header><div><p class="eyebrow">Gantry management</p><h1>Cortex</h1></div><a class="button" href="/app/">Back to Cortex</a></header><nav><button data-tab="users">Users</button><button data-tab="roles">Roles &amp; permissions</button><button data-tab="launcher">Launcher</button></nav><section data-section="users"><div class="heading"><div><p class="eyebrow">Access</p><h2>Users</h2><p>Create accounts, assign roles and control access.</p></div><button class="primary" data-add>Add user</button></div><div class="cards" data-users></div></section><section data-section="roles" hidden><div class="heading"><div><p class="eyebrow">Authorization</p><h2>Roles &amp; permissions</h2><p>Capabilities are shared through Gantry Core.</p></div></div><div class="cards" data-roles></div></section><section data-section="launcher" hidden><div class="heading"><div><p class="eyebrow">Instances</p><h2>Launcher</h2><p>Manage Cortex instances.</p></div><a class="button primary" href="/?config">Open launcher configuration</a></div></section></main><dialog><form method="dialog"><h2>Add user</h2><label>Username<input name="username" autocomplete="username" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="7" autocomplete="new-password" required></label><label>Confirm password<input name="confirm" type="password" minlength="7" autocomplete="new-password" required></label><div data-role-options></div><p id="manage-error" class="form-error"></p><div class="actions"><button value="cancel">Cancel</button><button value="save" class="primary">Create user</button></div></form></dialog></body></html>
