name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          node tests/agent-ux.test.js
          node tests/conversation-save.test.js
          node tests/markdown-render-smoke.js
          node tests/session-navigation.test.js
      - name: Build six release archives
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "tag must be vMAJOR.MINOR.PATCH" >&2; exit 1;; esac
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            stage=$(mktemp -d); name="cortex-${os}-${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$stage/cortex$ext" ./cmd/cortex
            cp README.md LICENSE "$stage/"
            if [ "$os" = windows ]; then (cd "$stage" && zip -Xq "$GITHUB_WORKSPACE/dist/$name.zip" "cortex$ext" README.md LICENSE); else tar --sort=name --owner=0 --group=0 --numeric-owner -C "$stage" -czf "dist/$name.tar.gz" cortex README.md LICENSE; fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum cortex-* > checksums.txt && sha256sum -c checksums.txt)
          test "$(find dist -type f | wc -l)" -eq 7
      - name: Write release notes
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-*) kind="preview / release candidate" ;;
            *) kind="stable public preview" ;;
          esac
          sed -e "s|{{VERSION}}|${GITHUB_REF_NAME#v}|" \
              -e "s|{{RELEASE_KIND}}|${kind}|" \
              docs/release-notes-template.md > release-body.md
          grep -q "{{VERSION}}\|{{RELEASE_KIND}}" release-body.md \
            && { echo "unresolved placeholder in the release body" >&2; exit 1; } || true
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-assets
          path: |
            dist/*
            release-body.md
          if-no-files-found: error
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      # The uploaded artifact contains dist/* plus release-body.md. Download at
      # the workspace root so attestation sees dist/* rather than dist/dist/*.
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: {name: release-assets, path: .}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.0
        with:
          subject-path: dist/cortex-*.tar.gz,dist/cortex-*.zip
  publish:
    needs: attest
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with: {name: release-assets, path: .}
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/checksums.txt,dist/cortex-*.tar.gz,dist/cortex-*.zip
          body_path: release-body.md
          prerelease: ${{ contains(github.ref_name, '-') }}
