name: Hardening contract

# Read-only verification on every push to main and on pull requests. The only
# permission is contents:read; nothing here builds a release or writes back.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs, consistent with repository policy.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: gofmt clean (maintained Go files)
        run: |
          fail=0
          for f in $(git ls-files '*.go'); do
            if [ -n "$(gofmt -l "$f")" ]; then
              echo "gofmt: $f needs formatting"
              fail=1
            fi
          done
          exit $fail

      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        run: go test -race ./...
      - name: go build -trimpath
        run: go build -trimpath -o /tmp/cortex ./cmd/cortex
      - name: node --check canonical JavaScript
        run: node --check public/assets/js/script.js
      - name: agent UX suite
        run: node tests/agent-ux.test.js
      - name: conversation-save suite
        run: node tests/conversation-save.test.js
      - name: markdown render smoke
        run: node tests/markdown-render-smoke.js
      - name: account-creation contract
        run: node tests/account-creation-contract.js
      - name: release smoke
        run: tests/release-smoke.sh
      - name: git diff --check
        run: git diff --check
      - name: workflow contract
        run: scripts/workflow-contract.sh

  service-lifecycle:
    # Exercises the real systemd user-service contract on Linux: the script
    # boots an isolated user manager when the runner has no login session, then
    # installs, reloads, enables/starts, verifies active state and health,
    # stops/starts/restarts, injects a start-limit failure and recovers via
    # reinstall, uninstalls, and reinstalls. It also runs systemd-analyze
    # --user verify over the generated unit so a malformed directive fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version-file: go.mod
          cache: true
      - name: install systemd analyze tooling
        run: |
          if ! command -v systemd-analyze >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y systemd-analyze
          fi
      - name: build cortex binary
        run: |
          mkdir -p "$HOME/.local/bin"
          go build -trimpath -o "$HOME/.local/bin/cortex" ./cmd/cortex
      - name: real systemd service lifecycle
        run: tests/service-lifecycle.sh
      - name: git diff --check
        run: git diff --check
